<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>あそべる日本地図</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <h1>あそべる日本地図</h1>
    <div class="controls">
      <span class="found">発見 <b id="found-count">0</b> / <span id="found-total">235</span></span>
      <button id="mute" class="icon" type="button" aria-label="音を消す">🔊</button>
      <button id="reset" type="button">元に戻す</button>
    </div>
  </header>

  <main class="stage">
    <svg id="map" role="img" aria-label="日本地図"></svg>
  </main>

  <div class="zoom" role="group" aria-label="拡大・縮小">
    <button id="zoom-in" type="button" aria-label="拡大">＋</button>
    <button id="zoom-out" type="button" aria-label="縮小">－</button>
    <button id="zoom-fit" type="button" aria-label="全体を表示">⤢</button>
  </div>

  <p id="hint" class="hint">都道府県をつかんで動かそう！ 投げてもOK・元の場所でピタッ ／ 海をドラッグで移動・ピンチで拡大</p>

  <div id="fx" aria-hidden="true"></div>

  <script src="js/map-data.js"></script>
  <script src="js/effects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
